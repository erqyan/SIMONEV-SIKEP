<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="maGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="maNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#maNavy)" stroke="url(#maGold)" stroke-width="6"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="url(#maGold)" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Inner Crest Shield -->
  <path d="M 100 25 L 155 50 L 155 105 C 155 145 100 170 100 170 C 100 170 45 145 45 105 L 45 50 Z" fill="#0F172A" stroke="url(#maGold)" stroke-width="3"/>

  <!-- Scales of Justice (Timbangan Keadilan) -->
  <path d="M 100 50 L 100 135" stroke="url(#maGold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 90 135 L 110 135 M 85 140 L 115 140" stroke="url(#maGold)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Scale Beam -->
  <path d="M 65 65 Q 100 60 135 65" fill="none" stroke="url(#maGold)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="62" r="5" fill="#FCD34D"/>

  <!-- Left Pan -->
  <line x1="68" y1="65" x2="60" y2="88" stroke="url(#maGold)" stroke-width="1.5"/>
  <line x1="68" y1="65" x2="76" y2="88" stroke="url(#maGold)" stroke-width="1.5"/>
  <path d="M 56 88 Q 68 98 80 88 Z" fill="url(#maGold)"/>

  <!-- Right Pan -->
  <line x1="132" y1="65" x2="124" y2="88" stroke="url(#maGold)" stroke-width="1.5"/>
  <line x1="132" y1="65" x2="140" y2="88" stroke="url(#maGold)" stroke-width="1.5"/>
  <path d="M 120 88 Q 132 98 144 88 Z" fill="url(#maGold)"/>

  <!-- Paddy and Cotton Wreath (Padi & Kapas Ring) -->
  <path d="M 40 100 A 62 62 0 0 0 100 162 A 62 62 0 0 0 160 100" fill="none" stroke="url(#maGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stars -->
  <polygon points="100,34 102,39 107,39 103,42 105,47 100,44 95,47 97,42 93,39 98,39" fill="#FCD34D"/>
</svg>
